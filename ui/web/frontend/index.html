<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Realtime Vision Analytics</title>

    <script src="js/jsmpeg.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
        }
        h1 {
            text-align: center;
            padding: 10px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .panel {
            border: 2px solid #444;
            padding: 10px;
            background: #222;
        }
        canvas {
            width: 640px;
            height: 480px;
            background: black;
        }

        .label {
            text-align: center;
            margin-bottom: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<h1>Realtime Vision Analytics</h1>

<div class="container">

    <div class="panel">
        <div class="label">Raw Camera Stream</div>
        <canvas id="video1"></canvas>
    </div>

    <div class="panel">
        <div class="label">AI Inference Output</div>
        <canvas id="video2"></canvas>
    </div>

</div>

<div id="telemetry-panel">

    <h3>Telemetry</h3>

    <div>Capture FPS: <span id="capture-fps">0</span></div>
    <div>Inference FPS: <span id="inference-fps">0</span></div>
    <div>Stream FPS: <span id="stream-fps">0</span></div>

    <div>Inference Latency: <span id="infer-lat">0</span> ms</div>
    <div>End-to-End Latency: <span id="e2e-lat">0</span> ms</div>

    <div>Dropped Frames: <span id="drops">0</span></div>

</div>

<script>

    const player1 = new JSMpeg.Player(
        'ws://localhost:8082/raw',
        {
            canvas: document.getElementById('video1'),
            autoplay: true,
            audio: false,
            loop: true,
            disableGl: false,
            preserveDrawingBuffer: true
        }
    );

    const player2 = new JSMpeg.Player(
        'ws://localhost:8082/ai',
        {
            canvas: document.getElementById('video2'),
            autoplay: true,
            audio: false,
            loop: true,
            disableGl: false,
            preserveDrawingBuffer: true
        }
    );

async function updateTelemetry() {

try {

        const response = await fetch("/api/telemetry");

        const data = await response.json();

        document.getElementById("capture-fps").innerText =
            data.capture_fps;

        document.getElementById("inference-fps").innerText =
            data.inference_fps;

        document.getElementById("stream-fps").innerText =
            data.stream_fps;

        document.getElementById("infer-lat").innerText =
            data.inference_latency_ms;

        document.getElementById("e2e-lat").innerText =
            data.end_to_end_latency_ms;

        document.getElementById("drops").innerText =
            data.dropped_frames;

    } catch (err) {

        console.error(err);
    }
}

    setInterval(updateTelemetry, 500);
</script>

</body>
</html>
